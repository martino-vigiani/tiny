name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test before releasing
        run: go test ./...

      # One static binary per platform. No cgo, no runtime dependencies, so a
      # plain cross-compile is all a release needs. The version is stamped
      # from the tag so `tiny -version` matches the GitHub release.
      - name: Cross-compile
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          while read -r os arch; do
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            stem="tiny-${os}-${arch}"
            out="dist/${stem}${ext}"
            echo "building $out ($version)"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "$out" ./cmd/tiny
            mkdir -p "dist/pkg/${stem}"
            if [ -n "$ext" ]; then
              cp "$out" "dist/pkg/${stem}/tiny.exe"
            else
              cp "$out" "dist/pkg/${stem}/tiny"
              chmod +x "dist/pkg/${stem}/tiny"
            fi
            cp LICENSE README.md "dist/pkg/${stem}/"
            tar -czf "dist/${stem}.tar.gz" -C dist/pkg "${stem}"
          done <<'TARGETS'
          darwin arm64
          darwin amd64
          linux amd64
          linux arm64
          windows amd64
          TARGETS

      - name: Checksums
        run: cd dist && sha256sum tiny-* > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
